services:
  postgres:
    image: postgres:16-alpine
    container_name: envops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: envops
    ports:
      - "5432:5432"
    volumes:
      - envops_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d envops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  envops_pg_data:
